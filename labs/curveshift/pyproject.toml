[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "curveshift-lab"
version = "0.1.0"
description = "Source-linked Treasury curve shocks, QuantLib bond revaluation and historical risk"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{name = "dev-belly"}]
dependencies = [
  "QuantLib==1.44", "nelson-siegel-svensson==0.5.0", "numpy==2.3.5",
  "scipy==1.17.0", "scikit-learn==1.8.0", "polars==2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.17.4"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.scripts]
curveshift = "curveshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
curveshift = ["data/*.csv", "data/*.json", "data/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
