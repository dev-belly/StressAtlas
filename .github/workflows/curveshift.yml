name: CurveShift research
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    name: CurveShift / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.12'}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      POLARS_MAX_THREADS: '2'
      PYTHONUTF8: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.6
      - name: Install the locked research application
        run: uv sync --project labs/curveshift --locked --extra api --extra dev
      - name: Lint
        run: uv run --project labs/curveshift --locked ruff check labs/curveshift/src labs/curveshift/tests labs/curveshift/scripts
      - name: Format
        run: uv run --project labs/curveshift --locked ruff format --check labs/curveshift/src labs/curveshift/tests labs/curveshift/scripts
      - name: Financial counterexamples, source dates and API
        run: uv run --project labs/curveshift --locked pytest labs/curveshift/tests -q
      - name: Replay the complete saved research
        run: uv run --project labs/curveshift --locked curveshift verify labs/curveshift/reports/demo
      - name: Installed wheel outside the checkout
        run: uv run --project labs/curveshift --locked python labs/curveshift/scripts/check_wheel.py
  browser:
    name: CurveShift Chrome laboratory
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CURVESHIFT_BROWSER_ARTIFACTS: browser-artifacts
      OPENBLAS_NUM_THREADS: '1'
      POLARS_MAX_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --project labs/curveshift --locked --extra api --extra dev
      - name: Reprice and download the visible scenario in real Chrome
        run: uv run --project labs/curveshift --locked python labs/curveshift/scripts/check_browser.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: curveshift-browser-evidence
          path: browser-artifacts
