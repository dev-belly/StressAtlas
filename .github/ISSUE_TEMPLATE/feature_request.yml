name: Feature request
description: "Propose a concrete improvement to borrower-level defaults, paired paths and empirical tail attribution."
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user workflow
      description: Describe a task that the current contract makes difficult, with a small synthetic example.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: "Explain inputs, outputs and failure behavior. Preserve the project's focus on borrower-level defaults, paired paths and empirical tail attribution."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How to check the result
      description: "For numerical differences, include OS, NumPy/SciPy versions and driver fingerprint. State whether the report was generated locally or copied from the committed Linux demo."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing approach and alternatives
      description: Link relevant documentation or prior issues and explain the remaining gap.
