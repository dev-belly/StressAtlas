[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stressatlas"
version = "0.1.0"
description = "Credit portfolio scenarios with paired Monte Carlo and discrete-tail attribution"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8,<4"]

[project.scripts]
stressatlas = "stressatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
